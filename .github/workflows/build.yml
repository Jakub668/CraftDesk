name: Build All CraftDesk Formats

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew jar
      - run: sudo apt-get update && sudo apt-get install -y rpm fakeroot wget curl unzip

      - name: Run jpackage for Linux
        run: |
          JAR_FILE=$(basename build/libs/*.jar)
          echo "Found JAR: $JAR_FILE"

          jpackage \
            --type deb \
            --name "CraftDesk" \
            --app-version "1.0.3" \
            --input build/libs \
            --main-jar "$JAR_FILE" \
            --main-class org.jakub.craftdesk.CraftDeskApp \
            --icon src/main/resources/images/icon.png \
            --dest dist-linux

          jpackage \
            --type rpm \
            --name "CraftDesk" \
            --app-version "1.0.3" \
            --input build/libs \
            --main-jar "$JAR_FILE" \
            --main-class org.jakub.craftdesk.CraftDeskApp \
            --icon src/main/resources/images/icon.png \
            --dest dist-linux

          jpackage \
            --type app-image \
            --name "CraftDesk" \
            --app-version "1.0.3" \
            --input build/libs \
            --main-jar "$JAR_FILE" \
            --main-class org.jakub.craftdesk.CraftDeskApp \
            --icon src/main/resources/images/icon.png \
            --dest dist-linux

      - name: Build AppImage using appimagetool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          APP_DIR="dist-linux/CraftDesk"

          if [ -f "$APP_DIR/lib/CraftDesk.png" ]; then
            cp "$APP_DIR/lib/CraftDesk.png" "$APP_DIR/icon.png"
          elif [ -f "src/main/resources/images/icon.png" ]; then
            cp "src/main/resources/images/icon.png" "$APP_DIR/icon.png"
          fi

          echo "[Desktop Entry]" > "$APP_DIR/CraftDesk.desktop"
          echo "Type=Application" >> "$APP_DIR/CraftDesk.desktop"
          echo "Name=CraftDesk" >> "$APP_DIR/CraftDesk.desktop"
          echo "Exec=CraftDesk" >> "$APP_DIR/CraftDesk.desktop"
          echo "Icon=icon" >> "$APP_DIR/CraftDesk.desktop"
          echo "Categories=Utility;" >> "$APP_DIR/CraftDesk.desktop"

          ln -s bin/CraftDesk "$APP_DIR/AppRun"
          chmod +x "$APP_DIR/AppRun"

          ./appimagetool-x86_64.AppImage "$APP_DIR"
          
          mkdir -p dist-linux/appimage
          mv *.AppImage dist-linux/appimage/

      - uses: actions/upload-artifact@v4
        with:
          name: CraftDesk-Linux-Formats
          path: |
            dist-linux/
            build/libs/*.jar

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew.bat jar
      - name: Create Windows .msi installer
        shell: bash
        run: |
          JAR_FILE=$(basename build/libs/*.jar)
          echo "Found JAR: $JAR_FILE"

          jpackage \
            --type msi \
            --name "CraftDesk" \
            --app-version "1.0.3" \
            --input build/libs \
            --main-jar "$JAR_FILE" \
            --main-class org.jakub.craftdesk.CraftDeskApp \
            --icon src/main/resources/images/icon.png \
            --dest dist-windows
      - uses: actions/upload-artifact@v4
        with:
          name: CraftDesk-Windows-Formats
          path: dist-windows/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew jar
      - name: Create macOS .dmg package
        run: |
          JAR_FILE=$(basename build/libs/*.jar)
          echo "Found JAR: $JAR_FILE"

          jpackage \
            --type dmg \
            --name "CraftDesk" \
            --app-version "1.0.3" \
            --input build/libs \
            --main-jar "$JAR_FILE" \
            --main-class org.jakub.craftdesk.CraftDeskApp \
            --icon src/main/resources/images/icon.png \
            --dest dist-macos
      - uses: actions/upload-artifact@v4
        with:
          name: CraftDesk-macOS-Formats
          path: dist-macos/
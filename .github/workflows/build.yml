name: Build All CraftDesk Formats

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  APP_VERSION: "1.0.3"
  JFX_VERSION: "21.0.10"
  MODULES: "javafx.controls,javafx.fxml,java.se,jdk.unsupported,jdk.crypto.ec,jdk.localedata"
  # Wygenerowany stały GUID dla projektu CraftDesk na Windowsie
  WIN_UPGRADE_UUID: "8f7e2d14-3a9b-4e1a-b6d8-9c2e0f4a7b11"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew jar
      - run: sudo apt-get update && sudo apt-get install -y rpm fakeroot wget curl unzip libfuse2

      - name: Run jpackage for Linux
        run: |
          JAR_FILE=$(basename build/libs/*.jar)
          echo "Found JAR: $JAR_FILE"

          curl -fsSL "https://download.gluonhq.com/openjfx/${JFX_VERSION}/openjfx-${JFX_VERSION}_linux-x64_bin-jmods.zip" -o javafx-jmods.zip
          unzip -q javafx-jmods.zip

          jpackage \
            --type deb \
            --name "CraftDesk" \
            --app-version "$APP_VERSION" \
            --input build/libs \
            --main-jar "$JAR_FILE" \
            --main-class org.jakub.craftdesk.CraftDeskApp \
            --module-path javafx-jmods-${JFX_VERSION} \
            --add-modules "$MODULES" \
            --icon src/main/resources/images/icon.png \
            --dest dist-linux

          jpackage \
            --type rpm \
            --name "CraftDesk" \
            --app-version "$APP_VERSION" \
            --input build/libs \
            --main-jar "$JAR_FILE" \
            --main-class org.jakub.craftdesk.CraftDeskApp \
            --module-path javafx-jmods-${JFX_VERSION} \
            --add-modules "$MODULES" \
            --icon src/main/resources/images/icon.png \
            --dest dist-linux

          jpackage \
            --type app-image \
            --name "CraftDesk" \
            --app-version "$APP_VERSION" \
            --input build/libs \
            --main-jar "$JAR_FILE" \
            --main-class org.jakub.craftdesk.CraftDeskApp \
            --module-path javafx-jmods-${JFX_VERSION} \
            --add-modules "$MODULES" \
            --icon src/main/resources/images/icon.png \
            --dest dist-linux

      - name: Build AppImage using appimagetool
        run: |
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage

          APP_DIR="dist-linux/CraftDesk"

          if [ -f "$APP_DIR/lib/CraftDesk.png" ]; then
            cp "$APP_DIR/lib/CraftDesk.png" "$APP_DIR/icon.png"
          elif [ -f "src/main/resources/images/icon.png" ]; then
            cp "src/main/resources/images/icon.png" "$APP_DIR/icon.png"
          fi

          echo "[Desktop Entry]" > "$APP_DIR/CraftDesk.desktop"
          echo "Type=Application" >> "$APP_DIR/CraftDesk.desktop"
          echo "Name=CraftDesk" >> "$APP_DIR/CraftDesk.desktop"
          echo "Exec=CraftDesk" >> "$APP_DIR/CraftDesk.desktop"
          echo "Icon=icon" >> "$APP_DIR/CraftDesk.desktop"
          echo "Categories=Utility;" >> "$APP_DIR/CraftDesk.desktop"

          ln -s bin/CraftDesk "$APP_DIR/AppRun"
          chmod +x "$APP_DIR/AppRun"

          mkdir -p dist-linux/appimage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run "$APP_DIR" "dist-linux/appimage/CraftDesk-$APP_VERSION-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: CraftDesk-Linux-Formats
          path: |
            dist-linux/*.deb
            dist-linux/*.rpm
            dist-linux/appimage/*.AppImage
            build/libs/*.jar

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew.bat jar

      - name: Ensure WiX Toolset
        shell: powershell
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
              Write-Host "WiX not found in PATH. Attempting fallback installation via Chocolatey..."
              choco install wixtoolset -y --no-progress | Out-Null
              $env:Path += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          } else {
              Write-Host "WiX Toolset is already installed and available in PATH."
          }

      - name: Prepare Windows Icon (.ico)
        shell: powershell
        run: |
          python -m pip install --upgrade pip pillow
          python -c "from PIL import Image; img = Image.open('src/main/resources/images/icon.png').convert('RGBA'); img.save('src/main/resources/images/icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Create Windows .msi installer
        shell: bash
        run: |
          JAR_FILE=$(basename build/libs/*.jar)
          echo "Found JAR: $JAR_FILE"

          curl -fsSL "https://download.gluonhq.com/openjfx/${JFX_VERSION}/openjfx-${JFX_VERSION}_windows-x64_bin-jmods.zip" -o javafx-jmods.zip
          unzip -q javafx-jmods.zip

          jpackage \
            --type msi \
            --name "CraftDesk" \
            --app-version "$APP_VERSION" \
            --input build/libs \
            --main-jar "$JAR_FILE" \
            --main-class org.jakub.craftdesk.CraftDeskApp \
            --module-path javafx-jmods-${JFX_VERSION} \
            --add-modules "$MODULES" \
            --icon src/main/resources/images/icon.ico \
            --win-shortcut \
            --win-menu \
            --win-dir-chooser \
            --win-upgrade-uuid "$WIN_UPGRADE_UUID" \
            --dest dist-windows
      - uses: actions/upload-artifact@v4
        with:
          name: CraftDesk-Windows-Formats
          path: dist-windows/*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew jar

      - name: Prepare macOS Icon (.icns)
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     src/main/resources/images/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     src/main/resources/images/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     src/main/resources/images/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     src/main/resources/images/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   src/main/resources/images/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   src/main/resources/images/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   src/main/resources/images/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   src/main/resources/images/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   src/main/resources/images/icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 src/main/resources/images/icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o src/main/resources/images/icon.icns

      - name: Create macOS .dmg package
        run: |
          JAR_FILE=$(basename build/libs/*.jar)
          echo "Found JAR: $JAR_FILE"

          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
            JMODS_ARCH="osx-aarch64"
          else
            JMODS_ARCH="osx-x64"
          fi

          curl -fsSL "https://download.gluonhq.com/openjfx/${JFX_VERSION}/openjfx-${JFX_VERSION}_${JMODS_ARCH}_bin-jmods.zip" -o javafx-jmods.zip
          unzip -q javafx-jmods.zip

          jpackage \
            --type dmg \
            --name "CraftDesk" \
            --app-version "$APP_VERSION" \
            --input build/libs \
            --main-jar "$JAR_FILE" \
            --main-class org.jakub.craftdesk.CraftDeskApp \
            --module-path javafx-jmods-${JFX_VERSION} \
            --add-modules "$MODULES" \
            --icon src/main/resources/images/icon.icns \
            --dest dist-macos
      - uses: actions/upload-artifact@v4
        with:
          name: CraftDesk-macOS-Formats
          path: dist-macos/*.dmg